<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Prompt Orchestrator</title>
    <style>
        :root {
            --primary: #4a90e2;
            --bg: #f4f7f6;
            --text: #333;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.6; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { border-bottom: 2px solid var(--primary); padding-bottom: 10px; color: var(--primary); }
        
        .input-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
        textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; resize: vertical; box-sizing: border-box; }
        
        .output-box { background: #f9f9f9; border: 2px dashed var(--primary); padding: 20px; border-radius: 8px; margin-top: 30px; position: relative; }
        #finalPrompt { white-space: pre-wrap; font-style: italic; color: #222; }
        
        .button-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
        .btn { padding: 10px 18px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; font-weight: bold; transition: opacity 0.2s; }
        .btn-copy { background: #27ae60; color: white; }
        .btn-chatgpt { background: #10a37f; color: white; }
        .btn-gemini { background: #1a73e8; color: white; }
        .btn-grok { background: #000000; color: white; }
        .btn:hover { opacity: 0.8; }

        .links-title { margin-top: 20px; font-size: 0.9em; color: #666; }
    </style>
</head>
<body>

<div class="container">
    <h2>Prompt Builder</h2>
    
    <div class="input-group">
        <label>Goal</label>
        <textarea id="goal" rows="3" placeholder="What is the purpose?"></textarea>
    </div>

    <div class="input-group">
        <label>Content</label>
        <textarea id="content" rows="4" placeholder="Specific details or concepts..."></textarea>
    </div>

    <div class="input-group">
        <label>Style</label>
        <textarea id="style" rows="3" placeholder="Format, lighting, or tone..."></textarea>
    </div>

    <div class="output-box">
        <label style="color: var(--primary);">Live Output</label>
        <div id="finalPrompt"></div>
        <div class="button-row">
            <button class="btn btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
        </div>
    </div>

    <div class="links-title">Open in:</div>
    <div class="button-row">
        <a href="https://chat.openai.com" target="_blank" class="btn btn-chatgpt">ChatGPT</a>
        <a href="https://gemini.google.com" target="_blank" class="btn btn-gemini">Gemini</a>
        <a href="https://grok.com" target="_blank" class="btn btn-grok">Grok</a>
    </div>
</div>

<script>
    const goalInput = document.getElementById('goal');
    const contentInput = document.getElementById('content');
    const styleInput = document.getElementById('style');
    const output = document.getElementById('finalPrompt');

    // Check URL for "type=image"
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('type') === 'image') {
            goalInput.value = "Act as a professional video production artist. Create a photorealistic, high-quality 1080p (16:9) background image for an instructional AI education video.";
            contentInput.value = "Concept: [ Wait For my instructions]";
            styleInput.value = "Composition Rule: Strict rule of thirds — the figure and spiral occupy the left two-thirds of the frame. The right third must be clean negative space — soft gradient background only, no objects — reserved for overlaying instructional text, bullet points, and titles in post-production. \n\nTechnical Specs: Photorealistic rendering, 16:9 aspect ratio, 1920×1080px, cinematic lighting, no text or watermarks in the image. Now Create image";
        }
        updateOutput();
    };

    function updateOutput() {
        const fullPrompt = `${goalInput.value}\n\n${contentInput.value}\n\n${styleInput.value}`.trim();
        output.innerText = fullPrompt;
    }

    function copyToClipboard() {
        navigator.clipboard.writeText(output.innerText);
        alert("Prompt copied to clipboard!");
    }

    // Event Listeners for real-time typing
    [goalInput, contentInput, styleInput].forEach(el => {
        el.addEventListener('input', updateOutput);
    });
</script>

</body>
</html>
